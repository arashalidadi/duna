# Temporary HTTP-only site for the ACME webroot challenge.
server {
    listen 80;
    listen [::]:80;
    server_name duna.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        return 200 "Duna TLS setup in progress\n";
    }
}
