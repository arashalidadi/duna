# Duna ERP — reverse proxy.
#
# The browser only ever talks to this origin. /api/v1 is served by the Next
# same-origin proxy inside the dashboard, so nginx needs a single upstream:
# the web server on :3000. The API on :3101 stays on loopback and is never
# published, which keeps API_CORS_ORIGINS unnecessary for browser traffic.
#
# Replace duna.example.com with the real hostname before enabling, then:
#   ln -s /etc/nginx/sites-available/duna.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

upstream duna_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name duna.example.com;

    # Keep the ACME HTTP-01 webroot available for unattended renewal.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect application traffic to TLS; the app sets Secure cookies behind it.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name duna.example.com;

    ssl_certificate     /etc/letsencrypt/live/duna-managed/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/duna-managed/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Next.js tells nginx the client used HTTPS; without this the app sees
    # x-forwarded-proto: http and will not mark its cookies Secure.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header Host              $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    client_max_body_size 12m;

    location / {
        proxy_pass http://duna_web;
        proxy_read_timeout 120s;
    }

    # Attachment downloads are streamed; do not buffer them into memory.
    location /api/v1/attachments/ {
        proxy_pass http://duna_web;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
