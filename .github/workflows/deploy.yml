name: deploy

# Automated deployment of the arena/5c597eb9-duna branch to the production
# server. Two gates run before anything touches the server:
#
#   changes  - did this push modify anything the running application depends on?
#   verify   - does the branch typecheck, lint, pass its tests and build?
#
# Only when both pass does `deploy` connect over SSH and run the repository's
# own installer, which is idempotent and repairs a previously failed install.
# A documentation-only push stops after `verify`, so docs work never restarts
# production.

on:
  push:
    branches:
      - arena/5c597eb9-duna
  workflow_dispatch:
    inputs:
      force:
        description: "Deploy even if no deploy-relevant files changed"
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BRANCH: arena/5c597eb9-duna

jobs:
  # -----------------------------------------------------------------------
  # 1. Work out whether this push can affect the deployed application.
  # -----------------------------------------------------------------------
  changes:
    name: Detect deploy-relevant changes
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.filter.outputs.runtime }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Anything the built artefacts or the runtime depend on.
          filters: |
            runtime:
              - 'apps/**'
              - 'packages/**'
              - 'prisma/**'
              - 'scripts/**'
              - 'deploy/**'
              - 'docker/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.env.example'
              - '.env.production.example'
              - 'tsconfig*.json'
              - '.github/workflows/deploy.yml'

      - id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "reason=manual dispatch" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.force }}" = "true" ]; then
            echo "reason=forced" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.filter.outputs.runtime }}" = "true" ]; then
            echo "reason=deploy-relevant paths changed" >> "$GITHUB_OUTPUT"
          else
            echo "reason=only non-runtime paths changed" >> "$GITHUB_OUTPUT"
          fi
          echo "runtime=${{ steps.filter.outputs.runtime }}" >> "$GITHUB_OUTPUT"

  # -----------------------------------------------------------------------
  # 2. Prove the branch is deployable. This job always runs.
  # -----------------------------------------------------------------------
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the Prisma client
        run: pnpm db generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit and contract tests
        run: pnpm test

      # NODE_ENV must not be set for the Next build; a non-standard value makes
      # Next refuse to prerender /404, /500 and /_not-found.
      - name: Build
        run: pnpm build
        env:
          NODE_ENV: ""

      - name: Verify the built artefacts exist
        run: |
          test -f apps/api/dist/src/main.js
          test -d apps/web/.next
          echo "artefacts present"

  # -----------------------------------------------------------------------
  # 3. Deploy over SSH.
  # -----------------------------------------------------------------------
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [changes, verify]
    environment:
      name: production
      url: https://${{ vars.DEPLOY_HOSTNAME }}
    if: needs.changes.outputs.runtime == 'true' || github.event.inputs.force == 'true'
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
    steps:
      - name: Require deployment configuration
        run: |
          : "${DEPLOY_HOST:?Secret DEPLOY_HOST is not set}"
          : "${DEPLOY_USER:?Secret DEPLOY_USER is not set}"
          echo "Deploying ${GITHUB_SHA::7} as ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH:-/opt/duna}"

      - name: Install the deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            # First connection records the host key. Prefer setting the
            # DEPLOY_SSH_KNOWN_HOSTS secret so this is verified instead.
            ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Upload the deployment tools
        run: |
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mkdir -p ${DEPLOY_PATH:-/opt/duna}/deploy"
          scp -i ~/.ssh/deploy_key -r deploy/systemd deploy/nginx \
            deploy/install-server.sh deploy/healthcheck.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH:-/opt/duna}/deploy/"

      - name: Run the installer
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<REMOTE
          set -euo pipefail
          cd "${DEPLOY_PATH:-/opt/duna}"
          chmod +x deploy/install-server.sh deploy/healthcheck.sh
          export APP_DIR="${DEPLOY_PATH:-/opt/duna}"
          export BRANCH="${BRANCH}"
          export REPO_URL="${REPO_URL}"
          # Administrative database URL for provisioning; the application's own
          # runtime URL is never used for DDL.
          export DUNA_ADMIN_DATABASE_URL='${{ secrets.DUNA_ADMIN_DATABASE_URL }}'
          bash deploy/install-server.sh --install
          REMOTE

      - name: Health check
        run: |
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "APP_DIR=${DEPLOY_PATH:-/opt/duna} bash ${DEPLOY_PATH:-/opt/duna}/deploy/healthcheck.sh"

      - name: Report the deployed commit
        if: always()
        run: |
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "git -C ${DEPLOY_PATH:-/opt/duna} log -1 --pretty='deployed %h %s (%cd)' --date=iso" \
            || echo "could not read the deployed revision"
