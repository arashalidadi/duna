name: Install and deploy Duna

on:
  push:
    branches: [arena/8f399c78-duna]
  workflow_dispatch:

concurrency:
  group: duna-production-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify before changing the server
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db generate

      - name: Build internal workspace packages
        run: pnpm --filter @shipping/config --filter @shipping/shared run build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Production builds
        run: pnpm build
        env:
          NODE_ENV: ""

      - name: Verify build outputs
        run: |
          test -f apps/api/dist/src/main.js
          test -d apps/web/.next
          echo "API and dashboard build artefacts verified for ${GITHUB_SHA}"

  deploy:
    name: Provision or safely update the server
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: verify
    environment:
      name: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
      DEPLOY_HOSTNAME: ${{ vars.DEPLOY_HOSTNAME }}
      TLS_EMAIL: ${{ vars.TLS_EMAIL }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      FRESH_INSTANCE_ID: ${{ secrets.FRESH_INSTANCE_ID }}
      FRESH_DATABASE_NAME: ${{ secrets.FRESH_DATABASE_NAME }}
      FRESH_NEW_SERVER_ACK: ${{ secrets.FRESH_NEW_SERVER_ACK }}
      FRESH_DB_SUPER_PASSWORD: ${{ secrets.FRESH_DB_SUPER_PASSWORD }}
      FRESH_DB_OWNER_PASSWORD: ${{ secrets.FRESH_DB_OWNER_PASSWORD }}
      FRESH_DB_RUNTIME_PASSWORD: ${{ secrets.FRESH_DB_RUNTIME_PASSWORD }}
      FRESH_ADMIN_EMAIL: ${{ secrets.FRESH_ADMIN_EMAIL }}
      FRESH_ADMIN_PASSWORD: ${{ secrets.FRESH_ADMIN_PASSWORD }}
      FRESH_AUTH_JWT_SECRET: ${{ secrets.FRESH_AUTH_JWT_SECRET }}
      FRESH_AUTH_REFRESH_SECRET: ${{ secrets.FRESH_AUTH_REFRESH_SECRET }}
      FRESH_ATTACHMENT_URL_SECRET: ${{ secrets.FRESH_ATTACHMENT_URL_SECRET }}
    steps:
      - name: Check whether deployment settings are configured
        id: configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ "${DEPLOY_ENABLED:-}" != true ]; then
            echo 'Deployment skipped: set the explicit opt-in variable DEPLOY_ENABLED=true only after reviewing the target settings.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=()
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_HOSTNAME TLS_EMAIL DEPLOY_SSH_PRIVATE_KEY DEPLOY_SSH_KNOWN_HOSTS \
            FRESH_INSTANCE_ID FRESH_DATABASE_NAME FRESH_NEW_SERVER_ACK \
            FRESH_DB_SUPER_PASSWORD FRESH_DB_OWNER_PASSWORD FRESH_DB_RUNTIME_PASSWORD \
            FRESH_ADMIN_EMAIL FRESH_ADMIN_PASSWORD FRESH_AUTH_JWT_SECRET \
            FRESH_AUTH_REFRESH_SECRET FRESH_ATTACHMENT_URL_SECRET; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if ((${#missing[@]})); then
            echo 'Deployment skipped: configure the required GitHub Actions settings before connecting to the server.'
            printf 'Missing setting name: %s\n' "${missing[@]}"
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.configuration.outputs.ready == 'true'
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate settings and create a private transfer file
        if: steps.configuration.outputs.ready == 'true'
        id: private-config
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_PORT DEPLOY_HOSTNAME TLS_EMAIL \
            DEPLOY_SSH_PRIVATE_KEY DEPLOY_SSH_KNOWN_HOSTS \
            FRESH_INSTANCE_ID FRESH_DATABASE_NAME FRESH_NEW_SERVER_ACK \
            FRESH_DB_SUPER_PASSWORD FRESH_DB_OWNER_PASSWORD FRESH_DB_RUNTIME_PASSWORD \
            FRESH_ADMIN_EMAIL FRESH_ADMIN_PASSWORD FRESH_AUTH_JWT_SECRET \
            FRESH_AUTH_REFRESH_SECRET FRESH_ATTACHMENT_URL_SECRET; do
            if [ -z "${!name:-}" ]; then echo "Required GitHub setting is missing: $name" >&2; exit 1; fi
          done
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo 'DEPLOY_HOST must be a DNS name or IPv4 address' >&2; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*\$?$ ]] || { echo 'Invalid DEPLOY_USER' >&2; exit 1; }
          [[ "$FRESH_INSTANCE_ID" =~ ^[a-z][a-z0-9-]{3,19}$ ]] || { echo 'Invalid FRESH_INSTANCE_ID' >&2; exit 1; }
          [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo 'Invalid repository identifier' >&2; exit 1; }
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ && "$DEPLOY_PATH" != *..* && "$DEPLOY_PATH" != *//* ]] || { echo 'DEPLOY_PATH must be a clean absolute path' >&2; exit 1; }
          [[ "$DEPLOY_PATH" != / ]] || { echo 'DEPLOY_PATH cannot be /' >&2; exit 1; }
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] && (( DEPLOY_PORT >= 1 && DEPLOY_PORT <= 65535 )) || { echo 'DEPLOY_PORT must be between 1 and 65535' >&2; exit 1; }
          [[ "$DEPLOY_HOSTNAME" =~ ^([a-z0-9]+(-[a-z0-9]+)*\.)+[a-z]{2,63}$ && ${#DEPLOY_HOSTNAME} -le 253 ]] || { echo 'DEPLOY_HOSTNAME must be a lowercase fully qualified DNS name' >&2; exit 1; }
          [[ "$TLS_EMAIL" =~ ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,63}$ ]] || { echo 'TLS_EMAIL must be a valid contact email' >&2; exit 1; }

          umask 077
          config_file="$RUNNER_TEMP/duna-fresh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.env"
          python3 - "$config_file" <<'PY'
          import os, pathlib, sys
          keys = (
              'FRESH_INSTANCE_ID', 'FRESH_DATABASE_NAME', 'FRESH_NEW_SERVER_ACK',
              'FRESH_DB_SUPER_PASSWORD', 'FRESH_DB_OWNER_PASSWORD', 'FRESH_DB_RUNTIME_PASSWORD',
              'FRESH_ADMIN_EMAIL', 'FRESH_ADMIN_PASSWORD', 'FRESH_AUTH_JWT_SECRET',
              'FRESH_AUTH_REFRESH_SECRET', 'FRESH_ATTACHMENT_URL_SECRET',
          )
          config = {key: os.environ[key] for key in keys}
          for key, value in config.items():
              if not value or '\n' in value or '\r' in value or '\0' in value or value != value.strip():
                  raise SystemExit(f'{key} must be nonempty, trimmed and contain no line breaks')
          import re
          if not re.fullmatch(r'[a-z][a-z0-9-]{3,19}', config['FRESH_INSTANCE_ID']):
              raise SystemExit('Invalid FRESH_INSTANCE_ID')
          if not re.fullmatch(r'duna_fresh_[a-z0-9]{3,24}', config['FRESH_DATABASE_NAME']):
              raise SystemExit('Invalid FRESH_DATABASE_NAME')
          if config['FRESH_NEW_SERVER_ACK'] != 'NEW_EMPTY_SERVER:' + config['FRESH_DATABASE_NAME']:
              raise SystemExit('FRESH_NEW_SERVER_ACK must exactly name FRESH_DATABASE_NAME')
          email = config['FRESH_ADMIN_EMAIL']
          if len(email) > 200 or email != email.lower() or not re.fullmatch(r'[^\s@]+@[^\s@]+\.[^\s@]+', email):
              raise SystemExit('FRESH_ADMIN_EMAIL must be a lowercase email address')
          secret_keys = ('FRESH_DB_SUPER_PASSWORD', 'FRESH_DB_OWNER_PASSWORD',
              'FRESH_DB_RUNTIME_PASSWORD', 'FRESH_ADMIN_PASSWORD', 'FRESH_AUTH_JWT_SECRET',
              'FRESH_AUTH_REFRESH_SECRET', 'FRESH_ATTACHMENT_URL_SECRET')
          for key in secret_keys:
              value = config[key]
              minimum = 16 if key == 'FRESH_ADMIN_PASSWORD' else 32
              if len(value) < minimum or any(ord(ch) < 32 or ord(ch) == 127 for ch in value) or value[:1] in ('"', "'"):
                  raise SystemExit(f'{key} does not meet the installer secret requirements')
          if len({config[key] for key in secret_keys}) != len(secret_keys):
              raise SystemExit('All FRESH_* passwords and signing secrets must be distinct')
          values = [f'{key}={config[key]}' for key in keys]
          path = pathlib.Path(sys.argv[1])
          path.write_text('\n'.join(values) + '\n', encoding='utf-8')
          path.chmod(0o600)
          PY
          echo "config_file=$config_file" >> "$GITHUB_OUTPUT"

      - name: Install SSH key and verify the pinned host key
        if: steps.configuration.outputs.ready == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/duna_deploy_key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/duna_known_hosts"
          chmod 600 "$HOME/.ssh/duna_deploy_key" "$HOME/.ssh/duna_known_hosts"
          if [ "$DEPLOY_PORT" = 22 ]; then host_pattern="$DEPLOY_HOST"; else host_pattern="[$DEPLOY_HOST]:$DEPLOY_PORT"; fi
          ssh-keygen -F "$host_pattern" -f "$HOME/.ssh/duna_known_hosts" >/dev/null || {
            echo 'Pinned DEPLOY_SSH_KNOWN_HOSTS has no entry for DEPLOY_HOST/DEPLOY_PORT' >&2; exit 1;
          }
          ssh-keygen -y -P '' -f "$HOME/.ssh/duna_deploy_key" >/dev/null

      - name: Transfer the exact verified source archive
        if: steps.configuration.outputs.ready == 'true'
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.private-config.outputs.config_file }}
        run: |
          set -Eeuo pipefail
          ssh_opts=(-i "$HOME/.ssh/duna_deploy_key" -p "$DEPLOY_PORT"
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/duna_known_hosts"
            -o ServerAliveInterval=30 -o ServerAliveCountMax=12
            -o ConnectTimeout=20)
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          repo="${GITHUB_REPOSITORY}"

          ssh "${ssh_opts[@]}" "$target" "bash -s -- '$DEPLOY_PATH' '$repo' '$FRESH_INSTANCE_ID' '$DEPLOY_USER'" <<'REMOTE'
          set -Eeuo pipefail
          path=$1
          repo=$2
          instance=$3
          user=$4
          marker="$path/.duna-managed"
          expected="$repo:$instance"
          if [ ! -e "$path" ]; then
            parent=$(dirname "$path")
            if [ -w "$parent" ]; then
              mkdir -p -- "$path"
            else
              sudo -n install -d -m 0750 -o "$user" -g "$(id -gn "$user")" -- "$path"
            fi
          fi
          [ -d "$path" ] && [ ! -L "$path" ] && [ -w "$path" ] || { echo 'Deploy path must be a non-symlink writable directory for DEPLOY_USER' >&2; exit 1; }
          if [ -e "$marker" ]; then
            [ -f "$marker" ] && [ ! -L "$marker" ] || { echo 'Invalid Duna ownership marker' >&2; exit 1; }
            IFS= read -r actual < "$marker"
            [ "$actual" = "$expected" ] || { echo 'Deploy path belongs to a different repository/install; refusing' >&2; exit 1; }
          else
            if find "$path" -mindepth 1 -maxdepth 1 -print -quit | grep -q .; then
              echo 'Deploy path is not empty and has no Duna ownership marker; refusing to overwrite it' >&2
              exit 1
            fi
            (umask 077; printf '%s\n' "$expected" > "$marker")
          fi
          REMOTE

          git archive --format=tar "$GITHUB_SHA" |
            ssh "${ssh_opts[@]}" "$target" "mkdir -p -- '$DEPLOY_PATH' && tar --no-same-owner -xf - -C '$DEPLOY_PATH'"

          # The private config is streamed byte-for-byte over the already pinned
          # SSH connection. No secret is interpolated into a shell command or
          # remote script. Existing installed secrets cannot silently rotate.
          cat "$CONFIG_FILE" | ssh "${ssh_opts[@]}" "$target" "umask 077; cat > '$DEPLOY_PATH/.env.fresh.local.incoming'"
          ssh "${ssh_opts[@]}" "$target" "bash -s -- '$DEPLOY_PATH'" <<'REMOTE'
          set -Eeuo pipefail
          path=$1
          config="$path/.env.fresh.local"
          temporary="$path/.env.fresh.local.incoming"
          chmod 600 "$temporary"
          if [ -e "$config" ]; then
            if ! cmp -s "$config" "$temporary"; then
              rm -f "$temporary"
              echo 'Fresh-install settings differ from the installed values; refusing implicit credential rotation' >&2
              exit 1
            fi
            rm -f "$temporary"
          else
            mv "$temporary" "$config"
          fi
          REMOTE

      - name: Install required host runtime (first run only as needed)
        if: steps.configuration.outputs.ready == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_opts=(-i "$HOME/.ssh/duna_deploy_key" -p "$DEPLOY_PORT"
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/duna_known_hosts"
            -o ServerAliveInterval=30 -o ServerAliveCountMax=12
            -o ConnectTimeout=20)
          ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "if [ \"\$(id -u)\" -eq 0 ]; then bash '$DEPLOY_PATH/scripts/fresh/bootstrap-host.sh' '$DEPLOY_USER'; else sudo -n bash '$DEPLOY_PATH/scripts/fresh/bootstrap-host.sh' '$DEPLOY_USER'; fi"

      - name: Fresh install or protected update, then health check
        if: steps.configuration.outputs.ready == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_opts=(-i "$HOME/.ssh/duna_deploy_key" -p "$DEPLOY_PORT"
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/duna_known_hosts"
            -o ServerAliveInterval=30 -o ServerAliveCountMax=12
            -o ConnectTimeout=20)
          ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "bash -s -- '$DEPLOY_PATH' '$FRESH_INSTANCE_ID' '$GITHUB_SHA' '$DEPLOY_HOSTNAME' '$TLS_EMAIL'" <<'REMOTE'
          set -Eeuo pipefail
          path=$1
          instance=$2
          revision=$3
          hostname=$4
          tls_email=$5
          export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"
          cd "$path"
          [ -f .env.fresh.local ] && [ ! -L .env.fresh.local ] || { echo 'Private install configuration is missing or unsafe' >&2; exit 1; }
          [ "$(stat -c '%a' .env.fresh.local)" = 600 ] || { echo 'Private install configuration must be mode 0600' >&2; exit 1; }
          state=".fresh-setup/$instance.json"
          if [ -e "$state" ]; then
            echo "[deploy] Updating existing installation to ${revision:0:12}; no reset or fresh seed"
            node scripts/duna.mjs setup --upgrade
          else
            echo "[deploy] Installing new isolated instance from ${revision:0:12}"
            node scripts/duna.mjs setup
          fi
          node scripts/duna.mjs setup --health
          node scripts/duna.mjs setup --status
          if [ "$(id -u)" -eq 0 ]; then
            bash scripts/fresh/configure-ingress.sh "$hostname" "$tls_email"
          else
            sudo -n bash scripts/fresh/configure-ingress.sh "$hostname" "$tls_email"
          fi
          printf 'DEPLOY_PASS revision=%s\n' "$revision"
          REMOTE

      - name: Verify public HTTPS dashboard and database health
        if: steps.configuration.outputs.ready == 'true'
        timeout-minutes: 5
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 --max-time 20 \
            "https://${DEPLOY_HOSTNAME}/fa/login" -o /dev/null
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 --max-time 20 \
            "https://${DEPLOY_HOSTNAME}/api/v1/health" |
            python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="ok" and d.get("database",{}).get("status")=="up"'
          echo "HTTPS_PASS https://${DEPLOY_HOSTNAME}/fa/login and proxied API/database health"

      - name: Remove temporary runner credentials
        if: always() && steps.configuration.outputs.ready == 'true'
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.private-config.outputs.config_file }}
        run: |
          rm -f "$HOME/.ssh/duna_deploy_key" "$HOME/.ssh/duna_known_hosts"
          if [ -n "${CONFIG_FILE:-}" ]; then
            rm -f "$CONFIG_FILE"
          fi
